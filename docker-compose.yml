version: "3.9"

services:
  retrieval-db:
    image: pgvector/pgvector:pg17
    container_name: credit-assistant-retrieval-db
    environment:
      POSTGRES_DB: credit_assistant
      POSTGRES_USER: credit_user
      POSTGRES_PASSWORD: credit_pass
    ports:
      - "5432:5432"
    volumes:
      - retrieval_db_data:/var/lib/postgresql/data
      - ./backend/migrations/0002_retrieval_schema_postgres.sql:/docker-entrypoint-initdb.d/0002_retrieval_schema_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_user -d credit_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  retrieval_db_data:
